# WREDD Dashboard on the shared VPS (/opt/wredd-dashboard). Secrets: ./.env (chmod 600).
# HTTPS comes from GK Parfum's Caddy via /opt/caddy-sites/wredd.caddy - no ports published here.
name: wredd

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wredd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wredd
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wredd -d wredd"]
      interval: 5s
      retries: 10
    networks: [default]

  app:
    build: .
    container_name: wredd-app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wredd:${POSTGRES_PASSWORD}@db:5432/wredd?sslmode=disable
      NEXTAUTH_URL: https://${APP_DOMAIN}
      APP_URL: https://${APP_DOMAIN}
      TZ: UTC
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [default, web]

networks:
  web:
    external: true

volumes:
  pgdata:
